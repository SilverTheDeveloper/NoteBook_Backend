# ── Server ────────────────────────────────────────────────
server.port=8080

# ── MySQL Database ─────────────────────────────────────────
# Change the database name, username and password to match yours
spring.datasource.url=jdbc:postgresql:////localhost:3306/notebook_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=8520
spring.datasource.driver-class-name=org.postgresql.Driver
# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# MySQL8Dialect is deprecated — let Hibernate auto-detect it

# ── JWT ────────────────────────────────────────────────────
# Move your secret here and inject with @Value("${jwt.secret}") in JwtUtil
jwt.secret=nota-super-secret-key-change-me-in-prod-!!!
jwt.expiry-ms=604800000
